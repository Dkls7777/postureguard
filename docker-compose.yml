services:
  db:
    image: postgres:16
    container_name: postureguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postureguard
      POSTGRES_USER: postureguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postureguard -d postureguard"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
